name: vinted

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5442:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vinted
    volumes:
      - vinted_dev_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vinted"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-test:
    image: postgres:18.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5445:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vinted_dev_pg:
